{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock %}

{% block content %}
<header class="band narrow sand page-header">
  <p class="label">{{ page.extra.subtitle }}</p>
  <h1>{{ page.title }}</h1>
</header>

<article class="band narrow page-body">
  <img class="page-photo" src="/images/{{ page.extra.image }}" alt="{{ page.extra.image_alt }}">
  <div class="page-text">
    {{ page.content | safe }}
  </div>
</article>
{% endblock %}
