{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock %}

{% block content %}
<header class="band narrow sand page-header">
  <div>
    <p class="label">{{ page.extra.subtitle }}</p>
    <h1 class="section-title">{{ page.title }}</h1>
    <blockquote>{{ page.extra.quote }}</blockquote>
  </div>
  <img src="/images/{{ page.extra.image }}" alt="{{ page.extra.image_alt }}">
</header>

<article class="band narrow page-text">
  {{ page.content | safe }}
</article>
{% endblock %}
